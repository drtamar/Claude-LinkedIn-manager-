[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-linkedin-manager"
version = "0.1.0"
description = "Claude-powered LinkedIn content, profile, and CV assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "drtamar" }]
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
linkedin-manager = "linkedin_manager.cli:main"

[tool.setuptools]
packages = ["linkedin_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
